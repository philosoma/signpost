name: image
# Publishes ghcr.io/<owner>/signpost for linux/arm64 and linux/amd64, so a fork
# publishes to its own namespace. Each build gets a :sha-<short> tag; deploys
# pin the digest.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA::7}"
          tags="${image}:sha-${short}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${image}:latest"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${image}:${GITHUB_REF_NAME}"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${short}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
      - name: Record the digest to pin
        run: echo "${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
