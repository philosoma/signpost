---
galaxy_info:
  role_name: signpost
  description: Signpost, the administrators' front page for a goatnet.
  license: Apache-2.0
  min_ansible_version: "2.14"
  platforms:
    - name: Ubuntu
      versions:
        - noble

# Both this and oauth2-proxy-surface come from goatcore.
dependencies:
  - role: rollback-ledger
    vars:
      rollback_component: signpost
      rollback_artifact_type: image
      rollback_ref: "{{ signpost_image }}"
