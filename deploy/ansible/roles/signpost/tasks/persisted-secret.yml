---
# Gives a secret one stable value: the supplied one, else what the host already
# holds, else a new one. Sets the fact named by persisted_fact.
- name: "signpost | check for {{ persisted_name }}"
  ansible.builtin.stat:
    path: "{{ signpost_secrets_dir }}/{{ persisted_name }}"
  register: signpost_secret_stat

- name: "signpost | generate {{ persisted_name }} on first deploy"
  ansible.builtin.command: "openssl rand {{ persisted_generate }}"
  register: signpost_secret_new
  changed_when: true
  no_log: true
  when:
    - not signpost_secret_stat.stat.exists
    - persisted_supplied | length == 0

- name: "signpost | persist {{ persisted_name }}"
  ansible.builtin.copy:
    content: "{{ (persisted_supplied if persisted_supplied | length > 0 else signpost_secret_new.stdout) | trim }}"
    dest: "{{ signpost_secrets_dir }}/{{ persisted_name }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: (not signpost_secret_stat.stat.exists) or persisted_supplied | length > 0

- name: "signpost | read {{ persisted_name }}"
  ansible.builtin.slurp:
    src: "{{ signpost_secrets_dir }}/{{ persisted_name }}"
  register: signpost_secret_file
  no_log: true

- name: "signpost | set the fact for {{ persisted_name }}"
  ansible.builtin.set_fact:
    "{{ persisted_fact }}": "{{ signpost_secret_file.content | b64decode | trim }}"
  no_log: true
